# /etc/systemd/system/nova-dream.service.d/vercel-proxy.conf
# Independent of /etc/nova/server.key. Generate only on the selected VPS.
[Service]
Environment=E3_WEB_PROXY_KEY_FILE=/run/nova-dream/vercel-proxy
LoadCredential=vercel-proxy:/etc/nova/vercel-proxy.key
ExecStartPre=+/usr/bin/install -o nova -g nova -m 0400 %d/vercel-proxy /run/nova-dream/vercel-proxy
