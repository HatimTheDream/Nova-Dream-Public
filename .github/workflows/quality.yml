name: Application quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm ci --prefix deploy/vercel
      - run: npm run quality
      - name: Verify Linux update recovery
        run: |
          python3 -B tests/update-runner.test.py -v
          python3 -B tests/update-closed-readers.test.py -v
          python3 -B tests/update-log-retention.test.py -v
          python3 -B tests/update-startup-window.test.py -v
          python3 -B tests/update-log-retention-integration.test.py -v
          NODE_BINARY="$(command -v node)"
          python3 -B tests/update-app-archive.test.py -v
          sudo env "NODE_BINARY=$NODE_BINARY" python3 -B tests/recovery-derived-state.test.py -v
          sudo env "NODE_BINARY=$NODE_BINARY" python3 -B tests/workspace-key-reader.test.py -v
          sudo env "NODE_BINARY=$NODE_BINARY" python3 -B tests/update-app-dependencies.test.py -v
          sudo env "NODE_BINARY=$NODE_BINARY" python3 -B tests/update-admission-driver.test.py -v
          sudo env "NODE_BINARY=$NODE_BINARY" python3 -B tests/update-dependency-selection.test.py -v

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Record this numbered public update
        run: node scripts/github-release.mjs --public
        env:
          GH_TOKEN: ${{ github.token }}
