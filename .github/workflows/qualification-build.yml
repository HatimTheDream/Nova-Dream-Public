name: Qualification build (no release)
on:
  push:
    branches: [codex/frontend-qualification-2-3-0, fix/startup-qualified-delivery]
permissions:
  contents: read
concurrency:
  group: nova-qualification-build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualification-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck the complete application
        run: npm run typecheck
      - name: Build the qualification candidate
        run: npm run build
      - name: Retain the qualification build
        run: python3 -B scripts/retain-ci-candidate.py
      - name: Check temporary artifact storage budget
        id: actions_storage_budget_1
        run: >-
          python "${{ github.workspace }}/scripts/ci-artifact-budget.py"
          --path "${{ runner.temp }}/nova-hosted-candidate/"
          --maximum-bytes 16777216 --maximum-files 4096
      - name: Upload the qualification application archive
        if: ${{ steps.actions_storage_budget_1.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nova-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/nova-hosted-candidate/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
